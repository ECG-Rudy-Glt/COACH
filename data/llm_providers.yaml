# Catalogue des fournisseurs d'IA. `LLM_PROVIDER` choisit l'entrée, `LLM_MODEL` le modèle (n'importe quel identifiant
# accepté par le fournisseur : la liste `models` n'est qu'une suggestion affichée par l'API et dans le README).
# Les identifiants de modèles évoluent : vérifiez-les dans la documentation du fournisseur avant de les figer.
#   kind      : anthropic (API Messages) ou openai (API « chat completions », la plus répandue)
#   base_url  : adresse de l'API, remplaçable par LLM_BASE_URL
#   key_env   : variable (ou NOM_FILE) portant la clé ; LLM_API_KEY sert de repli pour tous
#   model     : modèle par défaut (coach, chat, bilans) ; fast : modèle économique (estimation des repas), remplaçable par LLM_MODEL_FAST
#   vision    : le modèle sait lire une photo de repas ; tools : il sait appeler des outils (recherche dans l'historique de la montre)
#   json_mode : json_object = le bilan, les notifications et l'estimation des repas demandent `response_format: json_object` ; none (défaut) = on
#               s'appuie sur la consigne du prompt et le second essai. Si le service refuse l'option (HTTP 400/422), on réessaie sans elle.
#               `LLM_JSON_MODE=on|off` force le choix. Un modèle sans appel d'outils (tools: false, ou `LLM_TOOLS=off`, ou refus du service)
#               répond sans recherche dans l'historique : le chat reste disponible.
providers:
  anthropic:
    label: Anthropic (Claude)
    kind: anthropic
    base_url: https://api.anthropic.com/v1/messages
    key_env: ANTHROPIC_API_KEY
    key_required: true
    model: claude-sonnet-5-5
    fast: claude-haiku-4-5-20251001
    models:
      - { id: claude-fable-5-1, label: Claude Fable 5.1, vision: true, tools: true }
      - { id: claude-opus-5-5, label: Claude Opus 5.5, vision: true, tools: true }
      - { id: claude-sonnet-5-5, label: Claude Sonnet 5.5, vision: true, tools: true }
      - { id: claude-haiku-5-5, label: Claude Haiku 5.5, vision: true, tools: true }
      - { id: claude-haiku-4-5-20251001, label: Claude Haiku 4.5, vision: true, tools: true }
  openai:
    label: OpenAI
    kind: openai
    json_mode: json_object
    base_url: https://api.openai.com/v1
    key_env: OPENAI_API_KEY
    key_required: true
    model: gpt-4o
    fast: gpt-4o-mini
    models:
      - { id: gpt-4.1, label: GPT-4.1, vision: true, tools: true }
      - { id: gpt-4.1-mini, label: GPT-4.1 mini, vision: true, tools: true }
      - { id: gpt-4o, label: GPT-4o, vision: true, tools: true }
      - { id: gpt-4o-mini, label: GPT-4o mini, vision: true, tools: true }
  gemini:
    label: Google Gemini (API compatible OpenAI)
    kind: openai
    json_mode: json_object
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    key_env: GEMINI_API_KEY
    key_required: true
    model: gemini-2.5-flash
    fast: gemini-2.5-flash
    models:
      - { id: gemini-2.5-pro, label: Gemini 2.5 Pro, vision: true, tools: true }
      - { id: gemini-2.5-flash, label: Gemini 2.5 Flash, vision: true, tools: true }
      - { id: gemini-2.0-flash, label: Gemini 2.0 Flash, vision: true, tools: true }
  mistral:
    label: Mistral AI
    kind: openai
    json_mode: json_object
    base_url: https://api.mistral.ai/v1
    key_env: MISTRAL_API_KEY
    key_required: true
    model: mistral-large-latest
    fast: mistral-small-latest
    models:
      - { id: mistral-large-latest, label: Mistral Large, vision: false, tools: true }
      - { id: mistral-small-latest, label: Mistral Small, vision: true, tools: true }
      - { id: pixtral-large-latest, label: Pixtral Large, vision: true, tools: true }
  openrouter:
    label: OpenRouter (centaines de modèles)
    kind: openai
    json_mode: json_object
    base_url: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
    key_required: true
    model: openrouter/auto
    fast: openrouter/auto
    models:
      - { id: openrouter/auto, label: Choix automatique, vision: true, tools: true }
  ollama:
    label: Ollama (modèle local, aucune donnée ne quitte le serveur)
    kind: openai
    json_mode: json_object
    base_url: http://ollama:11434/v1
    key_env: OLLAMA_API_KEY
    key_required: false
    free: true
    model: qwen2.5:7b
    fast: qwen2.5:7b
    models:
      - { id: qwen2.5:7b, label: Qwen 2.5 7B, vision: false, tools: true }
      - { id: llama3.1:8b, label: Llama 3.1 8B, vision: false, tools: true }
      - { id: mistral:7b, label: Mistral 7B, vision: false, tools: true }
      - { id: llama3.2-vision:11b, label: Llama 3.2 Vision 11B, vision: true, tools: false }
  custom:
    label: Autre serveur compatible OpenAI (LLM_BASE_URL obligatoire)
    kind: openai
    base_url: ""
    key_env: LLM_API_KEY
    key_required: false
    model: ""
    fast: ""
    models: []
  none:
    label: Aucune IA (plan, nutrition et suivi restent disponibles)
    kind: none
    models: []
