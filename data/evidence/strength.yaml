- id: STR-007
  topic: strength
  citation: "Zourdos MC, Klemp A, Dolan C, Quiles JM, et al. (2016). Novel Resistance Training-Specific Rating of Perceived Exertion Scale Measuring Repetitions in Reserve. Journal of Strength and Conditioning Research."
  year: 2016
  doi: "10.1519/JSC.0000000000001049"
  pmid: "26049792"
  url: "https://pubmed.ncbi.nlm.nih.gov/26049792/"
  design: "étude observationnelle"
  finding_fr: "29 squatteurs (15 expérimentés, 14 novices) : le RPE basé sur les répétitions en réserve (RIR) est inversement lié à la vitesse de la barre (r = -0,88 et -0,77). Le RIR est un moyen pratique de réguler la charge du jour."
  limits_fr: "Petit échantillon, un seul exercice (squat). Étude de comparaison transversale, pas un essai d'entraînement : elle ne montre pas que piloter par RIR améliore les résultats."
