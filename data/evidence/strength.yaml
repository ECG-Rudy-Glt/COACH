  topic: strength
  citation: "Spiering BA, Mujika I, Sharp MA, Foulis SA (2021). Maintaining Physical Performance: The Minimal Dose of Exercise Needed to Preserve Endurance and Strength Over Time. Journal of Strength and Conditioning Research."
