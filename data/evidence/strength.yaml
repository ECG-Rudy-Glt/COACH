- id: STR-001
  topic: hypertrophy
  citation: "Schoenfeld BJ, Ogborn D, Krieger JW (2017). Dose-response relationship between weekly resistance training volume and increases in muscle mass: A systematic review and meta-analysis. Journal of Sports Sciences."
  year: 2017
  doi: "10.1080/02640414.2016.1210197"
  pmid: "27433992"
  url: "https://pubmed.ncbi.nlm.nih.gov/27433992/"
  design: "méta-analyse"
  finding_fr: "15 études, 34 groupes : relation dose-réponse graduée. Chaque série hebdomadaire de plus ajoute environ 0,37 % de gain de masse musculaire ; 10 séries ou plus par muscle donnent en moyenne plus de gain que moins de 5 (tendance, p = 0,074)."
  limits_fr: "Nombre d'études limité (15). Pas de plafond établi ni de plage de 10 à 20 séries démontrée en tant que telle ; le seuil catégoriel n'est qu'une tendance."
  applies_to: ["M1", "M2"]
  confidence: "moyenne"
  verified_on: "2026-10-18"
- id: STR-002
  topic: hypertrophy
  citation: "Schoenfeld BJ, Ogborn D, Krieger JW (2016). Effects of Resistance Training Frequency on Measures of Muscle Hypertrophy: A Systematic Review and Meta-Analysis. Sports Medicine."
  year: 2016
  doi: "10.1007/s40279-016-0543-8"
  pmid: "27102172"
  url: "https://pubmed.ncbi.nlm.nih.gov/27102172/"
  design: "méta-analyse"
  finding_fr: "10 études : une fréquence plus élevée donne un effet sur l'hypertrophie supérieur (0,49 contre 0,30). À volume équivalent, entraîner un muscle 2 fois par semaine est supérieur à 1 fois ; 3 fois contre 2 fois reste indéterminé."
  limits_fr: "Seulement 10 études. Les comparaisons à fréquence par muscle égale n'ont pas pu être chiffrées (échantillon insuffisant) ; la part due au volume supplémentaire reste difficile à isoler."
  applies_to: ["M1"]
  confidence: "moyenne"
  verified_on: "2026-10-18"
- id: STR-003
  topic: strength
  citation: "Grgic J, Schoenfeld BJ, Davies TB, Lazinica B, et al. (2018). Effect of Resistance Training Frequency on Gains in Muscular Strength: A Systematic Review and Meta-Analysis. Sports Medicine."
  year: 2018
  doi: "10.1007/s40279-018-0872-x"
  pmid: "29470825"
  url: "https://pubmed.ncbi.nlm.nih.gov/29470825/"
  design: "méta-analyse"
  finding_fr: "22 études : la force augmente avec la fréquence (effet 0,74 pour 1 séance par semaine jusqu'à 1,08 pour 4 ou plus), mais l'effet disparaît à volume égal. La fréquence sert surtout à répartir davantage de volume."
  limits_fr: "Majorité d'études sur des sujets peu entraînés, qualité méthodologique moyenne. Ne concerne que la force, pas l'hypertrophie."
  applies_to: ["M1"]
  confidence: "moyenne"
  verified_on: "2026-10-18"
- id: STR-004
  topic: hypertrophy
  citation: "Schoenfeld BJ, Grgic J, Ogborn D, Krieger JW (2017). Strength and Hypertrophy Adaptations Between Low- vs. High-Load Resistance Training: A Systematic Review and Meta-analysis. Journal of Strength and Conditioning Research."
  year: 2017
  doi: "10.1519/JSC.0000000000002200"
  pmid: "28834797"
  url: "https://pubmed.ncbi.nlm.nih.gov/28834797/"
  design: "méta-analyse"
  finding_fr: "21 études, séries menées jusqu'à l'échec : la force maximale (1RM) progresse davantage avec des charges lourdes (plus de 60 % du 1RM), mais l'hypertrophie est similaire sur toute la plage de charges."
  limits_fr: "Toutes les séries étaient menées à l'échec musculaire, ce qui ne reflète pas la pratique avec RIR 1-3. Durée minimale des études de 6 semaines ; ne dit rien sur les séries arrêtées avant l'échec."
  applies_to: ["M11", "I4"]
  confidence: "élevée"
  verified_on: "2026-10-18"
- id: STR-005
  topic: hypertrophy
  citation: "Refalo MC, Helms ER, Trexler ET, Hamilton DL, et al. (2023). Influence of Resistance Training Proximity-to-Failure on Skeletal Muscle Hypertrophy: A Systematic Review with Meta-analysis. Sports Medicine."
  year: 2023
  doi: "10.1007/s40279-022-01784-y"
  pmid: "36334240"
  url: "https://pubmed.ncbi.nlm.nih.gov/36334240/"
  design: "méta-analyse"
  finding_fr: "15 études : aucune preuve que l'échec musculaire soit supérieur à s'arrêter avant l'échec pour l'hypertrophie (effet 0,12, non significatif). Avantage trivial pour des séries proches de l'échec au sens large (0,19)."
  limits_fr: "Définitions de l'échec très variables entre études, peu d'études par sous-groupe. Ne porte que sur l'hypertrophie, pas sur la force ni sur la fatigue ou le risque de blessure."
