  topic: injury
  citation: "Lauersen JB, Andersen TE, Andersen LB (2018). Strength training as superior, dose-dependent and safe prevention of acute and overuse sports injuries: a systematic review, qualitative analysis and meta-analysis. British Journal of Sports Medicine."
  year: 2018
  doi: "10.1136/bjsports-2018-099078"
  pmid: "30131332"
  url: "https://pubmed.ncbi.nlm.nih.gov/30131332/"
  design: "méta-analyse"
  finding_fr: "6 essais randomisés, 7 738 sportifs de 12 à 40 ans : la musculation de prévention réduit fortement les blessures (RR 0,34). Plus de volume de musculation est associé à moins de blessures."
  limits_fr: "Seulement 6 essais, programmes variés, sportifs jeunes ; les blessures sont peu nombreuses (177). Le lien dose-réponse vient d'une méta-régression post hoc, et le résultat ne vaut pas pour la reprise après blessure."
