  pmid: "30808663"
  url: "https://pubmed.ncbi.nlm.nih.gov/30808663/"
  design: "méta-analyse"
  finding_fr: "15 études, 8 459 athlètes : les programmes incluant le Nordic hamstring réduisent le risque de blessure des ischio-jambiers (RR 0,49), soit environ moitié moins, y compris dans l'analyse limitée aux essais randomisés (RR 0,52)."
  limits_fr: "Concerne uniquement les ischio-jambiers. Sur 15 études, 8 présentent un risque de biais élevé (le résultat reste favorable sans elles, RR 0,55)."
