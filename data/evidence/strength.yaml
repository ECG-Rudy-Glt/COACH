  finding_fr: "Force et masse musculaire (jeunes) se maintiennent jusqu'à 32 semaines avec 1 séance par semaine et 1 série par exercice, si l'intensité relative (charge) est conservée. L'intensité est la variable clé du maintien."
  limits_fr: "Revue narrative brève, non systématique. Données insuffisantes pour les athlètes ; chez les plus âgés il faut 2 séances et 2-3 séries. Ne dit rien sur le maintien pendant un déficit calorique."
