  citation: "Moesgaard L, Beck MM, Christiansen L, Aagaard P, et al. (2022). Effects of Periodization on Strength and Muscle Hypertrophy in Volume-Equated Resistance Training Programs: A Systematic Review and Meta-analysis. Sports Medicine."
