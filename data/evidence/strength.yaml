  finding_fr: "69 publications : une perte de sommeil aiguë (6 h ou moins) réduit la performance de 7,6 % en moyenne, dont la force. Effet surtout après privation ou réveil précoce, et pour les efforts de l'après-midi plutôt que du matin."
  limits_fr: "Hétérogénéité très élevée (I2 = 98 %), 89 % d'hommes, perte de sommeil aiguë. Ne renseigne pas sur l'effet d'un manque de sommeil chronique modéré en entraînement réel."
