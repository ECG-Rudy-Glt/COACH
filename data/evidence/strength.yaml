  pmid: "34623696"
  url: "https://pubmed.ncbi.nlm.nih.gov/34623696/"
  design: "méta-analyse"
  finding_fr: "En déficit énergétique, la musculation donne moins de gain de masse maigre (ES -0,57) mais des gains de force comparables (ES -0,31, non significatif). Un déficit d'environ 500 kcal/j annule le gain de masse maigre."
  limits_fr: "Nombre d'essais limité et protocoles variés. La conclusion sur 500 kcal vient d'une méta-régression : un ordre de grandeur, pas un seuil exact. Force des jambes non analysée séparément."
