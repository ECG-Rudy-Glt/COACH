  doi: "10.3389/fphys.2026.1847569"
  pmid: "42524284"
  url: "https://pubmed.ncbi.nlm.nih.gov/42524284/"
  design: étude observationnelle
  finding_fr: "Résultats publics PRO et ELITE sur 7 saisons (11 842 femmes, 27 854 hommes) : la course représente environ 50 % du temps total et reste la composante la plus liée à la performance globale ; les stations de force pèsent surtout chez les plus lents."
  limits_fr: "Données publiques de résultats, athlètes PRO et ELITE seulement ; corrélations, aucun programme d'entraînement testé."
