  finding_fr: "24 hommes PRO (≈ 70 min) : la vitesse de course passe de 16,1 km/h au 1er kilomètre à 13,6 au 8e (10,5 dans la zone de transition) ; intensité moyenne ≈ 84 % du seuil VT2 et 76 % de la vitesse aérobie maximale ; tenir une intensité relative plus haute va avec un temps de course plus court."
  limits_fr: "24 hommes PRO, une seule épreuve ; ne dit rien des amateurs, des femmes ni de la façon de s'entraîner à cette allure."
