  citation: "Gutiérrez-Hellín J, Alonso-Domínguez S, Gil-Cabrera J, Arazola-López D, Sainz-Pérez M, Larnaudie-Faura C, Matias-López M, Martín-Gómez FJ, Franco-Andrés A, Del Coso J (2026). Relative Running Intensity and Pacing During an Official HYROX PRO MEN Competition: The HYScience Study. Int J Sports Physiol Perform."
