  finding_fr: "39 études (2015-2025) : l'entraînement fonctionnel à haute intensité améliore capacité aérobie, force, puissance anaérobie et tolérance à la fatigue ; hausses de VO2max de 8 à 15 % et de force de 10 à 20 % souvent rapportées, plus nettes chez les sujets entraînés."
