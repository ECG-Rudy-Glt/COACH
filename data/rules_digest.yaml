# Résumé des règles de docs/rules.md transmis au coach (identifiants fixes, texte court).
# Un test vérifie que les identifiants correspondent à docs/rules.md.
S1: "Signal d'alerte à l'effort non discuté avec un médecin : aucun plan d'intensité, renvoi médical."
S2: "Blessure active : exercices concernés exclus, progression gelée sur la zone (zone qui porte la course : volume, sortie longue et intensité de course gelés), message si la douleur persiste."
S3: "Perte de poids visée > 1 % du poids par semaine : objectif plafonné."
S4: "Antécédent de trouble alimentaire, grossesse ou post-partum : pas de déficit proposé."
S5: "Jamais sous le métabolisme de base estimé."
S6: "Mineur : pas de plan de perte de poids."
S7: "Blessure en texte libre (anglais, accents, pluriels) ramenée aux zones de S2 ; texte non reconnu jamais ignoré en silence : message, aucune erreur."
S8: "Entrée absurde (0 ou plus de 7 jours, durée nulle, échéance passée, deux objectifs le même jour) : jamais d'erreur, valeur ramenée à la plage de sécurité et message."
G1: "Montée du volume d'endurance de 10 % par semaine au plus, jamais deux fortes hausses de suite."
G2: "Cycle 3 semaines de montée puis 1 allégée (−30 à −40 % de volume), 2+1 si > 45 ans, reprise ou check-ins dégradés."
G3: "Reprise après arrêt : départ à 50 % (≤ 4 semaines d'arrêt) ou 30 %, montée sur 4 à 6 semaines."
G4: "Ratio charge aiguë/chronique : signal d'alerte souple seulement, jamais une cible."
G5: "Au plus une séance clé isolée par 48 h ; au moins un jour de repos complet par semaine."
G6: "Jours bloqués et durées maximales de l'utilisateur toujours respectés."
G8: "Reprise sans historique fiable (4 semaines sans courir ou plus) : G3 s'applique au volume déclaré ou par défaut, montée de 15 % par semaine au plus sans dépasser le volume d'avant l'arrêt."
G9: "Une séance voulue sans jour compatible n'est jamais retirée en silence : séance retirée ou remplacée dite dans les notes, moins de 3 séances possibles signalé."
G10: "En cours de semaine on ne planifie que les jours à venir ; plus rien à planifier ou week-end : semaine suivante ; plan vide : raison exacte."
G11: "G1 porte sur le volume réellement planifié : la semaine suivante repart du volume réellement planifié quand le visé n'a pas pu être atteint."
G12: "Durées maximales : course plafonnée au jour, musculation à 10 % près (accessoires retirés d'abord), séance qui ne tient pas : elle saute et le dit."
C1: "Environ 80 % du temps de course en facile, 20 % en intensité ; au plus 2 séances de qualité par semaine."
C2: "Une sortie longue par semaine, au plus 30 % du volume hebdomadaire de course."
C3: "Zones calculées sur la FC max, sinon sur l'allure du meilleur 10 km récent."
C4: "Trail : dénivelé hebdomadaire +10 % au plus par semaine ; sortie longue proche du D+ de l'objectif en fin de préparation."
C5: "Descentes : travail excentrique introduit progressivement."
C6: "Affûtage de 7 à 14 jours avant l'objectif (volume −40 à −60 %, intensité maintenue). Le jour de l'événement est la séance ; la veille 30 min de course au plus sans jambes ni intensité."
C7: "Essais de matériel, bâtons et ravitaillement avant l'objectif."
C8: "Objectif trail > 50 km : au moins 2 sorties longues de plus de 3 h avant l'affûtage."
M1: "Hypertrophie : 10 à 20 séries dures par groupe musculaire par semaine, sur au moins 2 séances."
M2: "Sèche : garder les charges lourdes, volume d'entretien (1/3 à 1/2 du volume de croissance)."
M3: "Protéines : 1,6 à 2,2 g/kg/jour, jusqu'à 2,4 en déficit."
M4: "Perte de poids : 0,5 à 1 % du poids par semaine, 0,5 % si une course est à moins de 12 semaines."
M5: "Double progression : monter les répétitions puis la charge de 2,5 à 5 % ; deux séances sous la fourchette : charge −5 à −10 %."
M6: "Priorité haut du corps déclarée : 60 % du volume en haut du corps ; jambes en entretien si course à moins de 8 semaines."
M11: "Répétitions : large plage (5-30) près de l'échec ; on alourdit les fourchettes au fil du bloc, variation par semaine = choix de pratique non démontré supérieur."
M12: "Proximité de l'échec : RIR 2-3 puis 1-2 ; jamais à l'échec sur les mouvements lourds ; 0-1 en réserve sur la dernière série des isolations."
M13: "Supersets : pour gagner du temps, pas de bénéfice d'hypertrophie démontré."
M10: "CrossFit dédié (sans course) : 2 à 6 séances distinctes selon les jours — force bas du corps, metcon, gymnastique, capacité aérobie, force haut du corps et haltérophilie technique, 2e metcon ou prévention."
M14: "Jamais deux séances dures sur les mêmes groupes deux jours de suite ; un jour de repos complet ; tout devient modéré en semaine allégée."
M15: "Metcons : format différent chaque semaine (AMRAP, For Time, EMOM, intervalles), 12 à 18 min, effort ≤ 8/10, mise à l'échelle par niveau, AMRAP de 8 min en décharge."
M16: "Force et gymnastique : 3 à 1 répétitions en réserve, jamais à l'échec sur squat/soulevé, haltérophilie légère et technique, version stricte avant l'élan, mouvements remplacés selon la blessure."
M17: "Capacité aérobie : une séance en zone 2 par semaine dès 4 jours, 30 à 60 min, +8 % par semaine, ×0,65 en décharge."
M18: "Hyrox dédié (sans course) : 2 à 6 séances — qualité de course, stations, course compromise, footing, haut du corps, aérobie sans impact ; la course (≈ 50 % de l'épreuve) suit G1 à G3."
M19: "Hyrox : charges de course officielles par catégorie (Open/Pro, hommes/femmes) ; l'entraînement en part selon le niveau (60 à 100 %), monte de 5 points par bloc et ne dépasse jamais le standard ; stations faibles d'abord."
M20: "Course compromise : station à demi-distance puis 1 km à l'allure Hyrox (≈ allure 10 km × 1,10), 3 à 8 répétitions ; zone de course blessée : rameur ou vélo."
M21: "Objectif Hyrox daté : demi-simulation à 5 semaines, simulation complète à 3 semaines (une seule), affûtage de 2 semaines, rien de dur la veille ni les 2 jours suivants ; sans objectif, demi-simulation à la 3e semaine d'un bloc sur deux."
M7: "Exercices choisis selon matériel, blessures et niveau ; 6 à 8 exercices par séance au plus."
I1: "Jambes lourdes et séance d'endurance intense séparées de 6 h au moins, idéalement de jours différents."
I2: "Pas de jambes lourdes la veille d'une séance clé de course ni dans les 48 h avant un objectif."
I3: "Course facile et haut du corps peuvent être le même jour."
I4: "Musculation des jambes en préparation de course : force (3 à 6 répétitions), pas épuisement."
I5: "Jambes lourdes déclarées après la muscu : volume de jambes −1/3 et séances éloignées des séances clés."
I6: "Hyrox/CrossFit : séances comptées dans la charge globale, au plus une séance mixte intense par semaine en préparation trail."
I7: "Course + Hyrox/CrossFit : la course garde ses séances clés ; une séance hybride dure par semaine au plus, à 48 h des séances clés, sa course est retranchée du volume (G1), la simulation complète remplace la sortie longue ; à moins de 8 semaines d'un objectif de course la course l'emporte (Hyrox : stations légères seulement)."
R1: "Check-in dégradé : séance du jour réduite de 30 % ou remplacée par du facile."
R2: "Check-in dégradé 3 jours sur 7 : semaine allégée et question de clarification."
R3: "Douleur localisée : règle S2."
R4: "Le check-in peut seulement alléger un jour, jamais l'alourdir."
R5: "FC de repos et charge Garmin : signaux secondaires, jamais décisifs seuls."
G7: "Périodisation : blocs 3+1 dont la position est conservée d'une génération du plan à l'autre ; phases base, développement, pic (2 à 4 semaines avant l'objectif), affûtage, semaine de l'objectif."
M8: "Surcharge progressive : séries et répétitions montent dans le bloc, le bloc suivant démarre plus haut (+1 série sur les mouvements clés, +1 répétition de qualité) ; charges par double progression."
M9: "Séance hybride hebdomadaire (CrossFit/Hyrox déclaré) à la place de la 3e séance de muscu : WOD qui monte d'un bloc à l'autre, allégée en décharge, jamais collée à la sortie longue ni le jour d'une séance clé, supprimée près de l'objectif."
C9: "Objectif de course à moins de 12 semaines : sortie longue guidée par l'objectif (+10 min par semaine depuis la plus longue sortie récente, jusqu'à ~75 % de la durée estimée), footings courts, plus rapide que G1 : à alléger dès qu'une douleur est déclarée."
C13: "Un record n'est pas un niveau actuel : quand le niveau ne vient que d'un record, on l'annonce comme point de départ (probablement plus rapide que le niveau du moment) et on invite à saisir un temps récent."
C14: "Niveau actuel de course : temps actuel saisi > meilleur effort des 8 dernières semaines mesuré par la montre (converti par Riegel) > record seul. Une sortie soutenue (FC moyenne ≥ 85 % de la FC max) donne une estimation ; sans FC ou à FC intermédiaire, elle ne prouve qu'une borne (au moins aussi rapide que) ; un footing (< 75 %) est écarté. Source et date affichées."
C15: "Niveau actuel de force : meilleur e1RM d'Epley (1 à 10 répétitions) des séances faites sur 12 semaines, par exercice de référence ; affiché comme estimé, sans remplacer la saisie de l'utilisateur."
C10: "Niveau actuel d'un objectif de performance : équivalence entre distances (Riegel, exposant 1,06) appliquée aux records ; on garde l'équivalent le plus lent par prudence."
C11: "Trajectoire vers un objectif de performance daté : base, bloc seuil (12 semaines), bloc spécifique à l'allure visée (8 semaines), affûtage ; tests tous les 3 mois ; un ultra ne se place pas dans les 20 semaines avant l'objectif ni les 3 après ; un événement à moins de 12 semaines prime (C9)."
C12: "Volume hebdomadaire visé d'après le temps équivalent au 10 km (sub 40 : 50 km, sub 45 : 40 km…) : la montée de G1 s'arrête à ce plafond tant que l'objectif est lointain."
N1: "Énergie : dépense estimée moins déficit ; jamais sous le métabolisme de base ni le plancher (1 500 kcal hommes, 1 200 femmes)."
N2: "Protéines : 2,0 g/kg en perte de poids avec musculation (1,8 à 2,4), réparties sur 3 à 5 prises."
N3: "Lipides ≥ 0,8 g/kg ; glucides pour le reste, un peu plus les jours de séance de 45 min ou plus."
N4: "Perte de 0,5 % du poids par semaine près d'un objectif sportif, 0,75 % sinon ; ajuster de 100 à 150 kcal seulement après 3 semaines."
N5: "Poids : tendance sur plusieurs mois par régression linéaire (1, 3, 6 ou 12 mois), courbe lissée, au moins 3 pesées sur 14 jours pour l'afficher, jamais le chiffre d'un jour."
N6: "Estimations de repas (texte ou photo) : ordres de grandeur avec sous-estimation fréquente ; on suit les moyennes hebdomadaires, jamais un repas isolé ; aucun jugement moral."
N7: "Pas de déficit pour un mineur, une grossesse, ni un antécédent de trouble alimentaire : renvoi vers un professionnel."
N8: "Qualité : 25-30 g de fibres, légumes à chaque repas, ultra-transformés et alcool limités."
ST1: "Statistiques : chaque chiffre vient des données stockées et du moteur, jamais d'un LLM ; donnée absente = absente ; estimation marquée ≈ ; alternative texte à chaque graphique."
ST2: "Statistiques repas : moyenne sur les jours estimés seulement, cible affichée seulement si taille, naissance et poids connus, sans jugement."
ST3: "Statistiques poids : pesées et courbe lissée ; tendance en kg et % par mois seulement avec 3 pesées sur 14 jours au moins."
ST4: "Statistiques pas : relevés de la montre, jour en cours hors moyenne, total 0 non enregistré."
ST5: "Statistiques activité : séance reliée à la montre comptée une fois ; allure seulement pour une course d'au moins 1 km."
N9: "Estimation de repas peu sûre : 1 à 2 questions courtes au plus (quantité, graisse de cuisson, sauce, boisson), on peut toujours passer ; l'estimation est refaite avec les réponses."
N10: "Valeur déclarée avant valeur devinée : code-barres puis correction de l'utilisateur, qui sert d'exemple aux estimations suivantes ; chiffre principal = moyenne hebdomadaire."
ST6: "Statistiques records de course : déclaré, mesuré (meilleure allure sur sortie assez longue) et estimation de la montre restent séparés, jamais extrapolés."
ST7: "Statistiques charges : e1RM Epley seulement pour 1 à 10 répétitions chargées, marqué ≈ ; sans charge, répétitions ; séances faites seulement."
ST8: "Statistiques trajectoire : objectif de performance actif et daté seulement ; phases et jalons de C10 à C12 ; repère interpolé, pas une prévision."
ST9: "Statistiques volume : semaine du lundi, semaine en cours incomplète, kilomètres mesurés par la montre, séance reliée comptée une fois."
ST10: "Statistiques allure : points non reliés ; comparaison 28 j / 28 j seulement avec 3 sorties d'au moins 3 km de chaque côté."
ST11: "Statistiques régularité : semaine tenue à 75 % des séances prévues faites ; séance passée volontairement hors calcul ; semaine en cours jamais jugée non tenue."
ST12: "Statistiques séries : semaines tenues consécutives ; semaine sans séance prévue neutre ; pas de badge."
ST13: "Statistiques régularité désactivable dans le profil ; aucune notification ni relance fondée dessus ; ton sans culpabilisation."
ST14: "Statistiques araignée : axes mesurés seulement (volume, régularité, endurance, force) ; vitesse et récupération non tracées ; pas de score global ; axe sans donnée suffisante non tracé ; polygone dès 3 axes."
ST15: "Statistiques araignée : axe = pourcentage de sa propre référence, plafonné à 100 ; pas de comparaison à d'autres ni de table ; valeur brute, référence, source et période affichées en texte."
ST16: "Statistiques araignée, volume : moyenne des 4 dernières semaines terminées (km ou minutes) face au repère du plan C12 ou à la meilleure semaine des 12 précédentes."
ST17: "Statistiques araignée, régularité : séances faites / prévues sur 12 semaines terminées, 8 séances prévues minimum ; masquée dans le profil, rien n'est calculé (ST13)."
ST18: "Statistiques araignée, endurance : meilleur effort montre des 8 dernières semaines (C14, Riegel) face au temps visé ou à son meilleur estimé antérieur ; temps saisis et records exclus ; borne signalée."
ST19: "Statistiques araignée, force : e1RM Epley des 12 dernières semaines face aux 12 précédentes, moyenne d'au moins 2 exercices."
ST20: "Statistiques araignée : comparaison à il y a 4 semaines, tracée seulement si chaque axe dessiné a une valeur à cette date ; écart en points, sans jugement."
