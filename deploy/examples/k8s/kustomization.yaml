apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sport-coach
resources:
  - namespace.yaml
  - postgres.yaml
  - app.yaml
  - cronjobs.yaml
# Pin the image tag here (or let your GitOps tool bump it).
images:
  - name: sport-coach
    newName: ghcr.io/ecg-rudy-glt/coach
    newTag: "latest"          # pin a release tag (e.g. 0.1.0) in production
