[package]
name = "coach-desktop"
version = "0.1.0"
description = "COACH desktop application (Tauri shell around the bundled Python server)"
authors = ["COACH contributors"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Trousseau de l'OS : Credential Manager (Windows), Secret Service (Linux : GNOME Keyring, KWallet), Keychain (macOS).
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust", "vendored"] }
getrandom = "0.2"
# Recherche de la dernière Release (API publique GitHub) ; le téléchargement signé passe par tauri-plugin-updater. Aucune autre requête sortante côté coque.
ureq = { version = "2", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
