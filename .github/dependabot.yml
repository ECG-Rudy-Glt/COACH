version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]   # move Python deliberately, with the CI matrix
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      github-actions:
        patterns: ["*"]
