name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: coach
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: coach_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U coach -d coach_test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://coach:ci-only-password@localhost:5432/coach_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q --cov --cov-report=term
      - name: Coverage summary
        if: always()
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

  changelog:
    name: Changelog entry
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: CHANGELOG.md is updated when code changes
        env:
          BASE: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/$BASE"...HEAD)
          if echo "$changed" | grep -qE '^(app/|db/|questions/|data/)' && ! echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "::error::Code, migrations, questions or rule data changed but CHANGELOG.md has no new entry under [Unreleased] (label the PR skip-changelog if it is not user-visible)."
            exit 1
          fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install pip-audit && pip-audit -r requirements.txt

  docker:
    name: Docker build and compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create placeholder secrets
        run: scripts/init-secrets.sh
      - run: docker compose config -q
      - run: docker compose --profile https --profile backup --profile ollama config -q
      - name: Build image and smoke-test the stack
        run: |
          docker compose build
          docker compose up -d db app
          for i in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q app)")" = healthy ] && break; sleep 3
          done
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS -I http://127.0.0.1:8000/ | grep -i content-security-policy
          docker compose down -v

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
